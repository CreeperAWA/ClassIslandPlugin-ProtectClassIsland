name: Build ClassIsland ProtectClassIsland Plugin

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin
        run: dotnet build -c Release ClassIslandPlugin.ProtectClassIsland/ClassIslandPlugin.ProtectClassIsland.csproj

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-cipx
          path: ClassIslandPlugin.ProtectClassIsland/cipx/*.cipx
          if-no-files-found: error

  release-build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin
        run: dotnet build -c Release ClassIslandPlugin.ProtectClassIsland/ClassIslandPlugin.ProtectClassIsland.csproj

      - name: Upload plugin to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClassIslandPlugin.ProtectClassIsland/cipx/*.cipx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
